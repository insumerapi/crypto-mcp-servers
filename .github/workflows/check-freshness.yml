name: Check Freshness

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  issues: write

env:
  ISSUE_TITLE: "Weekly freshness check: stale or archived servers"

jobs:
  check-freshness:
    name: Check catalog repositories
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check freshness
        id: validate
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          npm run check:freshness 2>&1 | tee freshness-report.txt

      - name: Look up the tracking issue
        id: tracker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq 'map(select(.title == env.ISSUE_TITLE)) | first | .number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Report stale servers
        if: steps.validate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.tracker.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The weekly freshness check flagged these catalog repositories as archived, missing, or inactive for over a year. Each one needs a maintainer review: keep it with a note, swap in a maintained fork, or remove it."
            echo
            echo '```'
            grep '^FAIL ' freshness-report.txt || echo "See the run log for details."
            echo '```'
            echo
            echo "Last checked $(date -u '+%Y-%m-%d %H:%M UTC') in [this run]($RUN_URL)."
            echo
            echo "This issue is maintained by the weekly freshness check and closes on its own once every repository passes again."
          } > issue-body.md

          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" --body-file issue-body.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file issue-body.md
          fi

      - name: Close the tracking issue
        if: steps.validate.outcome == 'success' && steps.tracker.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.tracker.outputs.number }}
        run: |
          gh issue close "$ISSUE_NUMBER" --comment "Every catalog repository passed the latest freshness check."

      - name: Fail if any server is stale
        if: steps.validate.outcome == 'failure'
        run: exit 1
